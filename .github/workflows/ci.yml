name: CI
on:
  push: { branches: [main, develop, "feature/**"] }
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: plit, POSTGRES_PASSWORD: plit, POSTGRES_DB: plit_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U plit" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://plit:plit@localhost:5432/plit_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789
      PAYMENT_PROVIDER: MOCK
      REWARDS_LIVE: "false"
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plit/api exec prisma generate
      - run: pnpm --filter @plit/api exec prisma migrate deploy
      - run: pnpm --filter @plit/api typecheck
      - run: pnpm --filter @plit/api test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plit/web typecheck
      - run: pnpm --filter @plit/web build
