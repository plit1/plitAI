# develop 브랜치 → 스테이징 자동 배포. 테스트(CI)가 모두 통과해야 이미지 빌드·배포가 진행된다.
# 준비 전(저장소 변수 STAGING_DEPLOY_ENABLED != 'true')에는 테스트만 하고 배포는 건너뛴다.
name: Deploy staging
on:
  push: { branches: [develop] }
  workflow_dispatch:
    inputs:
      seed:
        description: "기본 데이터(자격증·데모 공고 등) 다시 넣기"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: { group: deploy-staging, cancel-in-progress: false }

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions: { contents: read, id-token: write }
    strategy:
      matrix: { app: [api, web] }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: ap-northeast-2 }
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3 # 서버가 ARM(Graviton) → arm64 이미지
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ matrix.app == 'api' && vars.ECR_API || vars.ECR_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: ap-northeast-2 }
      - name: 서버 배포 (마이그레이션 → 교체 → 상태 확인, 실패 시 자동 되돌림)
        run: deploy/scripts/ssm-deploy.sh "${{ vars.INSTANCE_ID }}" "${{ github.sha }}" "${{ inputs.seed && '--seed' || '' }}"
      - name: 외부 접속 확인 (CloudFront 경유)
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ vars.APP_URL }}/api/v1/health" && curl -fsS -o /dev/null "${{ vars.APP_URL }}/"; then echo; echo "OK"; exit 0; fi
            sleep 6
          done
          exit 1
